name: Neon Rush Auto-Play QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoplay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 headless-capable editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --version

      - name: Run 100-game stress test and capture console
        shell: bash
        run: |
          python3 tools/run_autoplay.py \
            --godot /tmp/Godot_v4.4.1-stable_linux.x86_64 \
            --runs 100 --seconds 60 --strategy competent --timeout 360 \
            --output reports/competent

      - name: Run 25-game reference strategy
        shell: bash
        run: |
          python3 tools/run_autoplay.py \
            --godot /tmp/Godot_v4.4.1-stable_linux.x86_64 \
            --runs 25 --seconds 60 --strategy reference --timeout 240 \
            --output reports/reference

      - name: Run 25-game basic strategy
        shell: bash
        run: |
          python3 tools/run_autoplay.py \
            --godot /tmp/Godot_v4.4.1-stable_linux.x86_64 \
            --runs 25 --seconds 60 --strategy basic --timeout 240 \
            --output reports/basic

      - name: Run v0.4 feature tests and capture console
        if: always()
        shell: bash
        run: |
          python3 tools/run_autoplay.py --suite features \
            --godot /tmp/Godot_v4.4.1-stable_linux.x86_64 \
            --timeout 45 --output reports

      - name: Capture rendered gameplay screenshots
        if: always()
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libx11-6 libxcursor1 libxrandr2 libxi6 libasound2t64
          mkdir -p reports/screenshots
          printf '{"git_commit_sha":"%s","workflow_run_id":"%s","godot_version":"4.4.1","capture_type":"staged visual checkpoints"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > reports/screenshots/manifest.json
          timeout 45s xvfb-run -a -s "-screen 0 1024x900x24" \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path . --quit-after 1200 \
            --script res://tests/screenshots.gd -- \
            --output="$PWD/reports/screenshots"

      - name: Upload logs and reports (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-autoplay-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
